x-app-build: &app-build
  context: .
  args:
    APP_VERSION: ${APP_VERSION:-2.0.0}
    APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  APP_VERSION: ${APP_VERSION:-2.0.0}
  APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
  CELERY_TIMEZONE: ${CELERY_TIMEZONE:-America/Sao_Paulo}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
  RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
  LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-50}
  REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5}
  REFRESH_RATE_LIMIT: ${REFRESH_RATE_LIMIT:-30}
  PASSWORD_CHANGE_RATE_LIMIT: ${PASSWORD_CHANGE_RATE_LIMIT:-5}
  INVITATION_RATE_LIMIT: ${INVITATION_RATE_LIMIT:-20}
  CONTINUOUS_EVALUATE_RATE_LIMIT: ${CONTINUOUS_EVALUATE_RATE_LIMIT:-6}
  ADVISOR_CHAT_RATE_LIMIT: ${ADVISOR_CHAT_RATE_LIMIT:-20}
  TRADING_MUTATION_RATE_LIMIT: ${TRADING_MUTATION_RATE_LIMIT:-30}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
  DEBUG: "false"
  DEMO_MODE_ENABLED: "false"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging

  migrate:
    build: *app-build
    restart: "no"
    # The Vinance schema and the externally-owned Trading schema keep separate
    # version histories, but one production gate upgrades both exactly once
    # before any web/worker process is allowed to start.
    command: ["sh", "-c", "alembic upgrade head && python -m backend.trading.storage.migrate upgrade"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging

  backend:
    build: *app-build
    restart: unless-stopped
    command: ["gunicorn", "backend.app.main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "${WEB_CONCURRENCY:-2}", "--timeout", "${WEB_TIMEOUT_SECONDS:-120}", "--graceful-timeout", "${WEB_GRACEFUL_TIMEOUT_SECONDS:-30}", "--access-logfile", "-", "--error-logfile", "-"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal, egress]
    volumes:
      - ml_artifacts_data:/app/data/ml_artifacts
      - trading_artifacts_data:/app/backend/trading/artifacts/ml_engine_v2
      - trading_outputs_data:/app/backend/trading/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          host = os.environ['TRUSTED_HOSTS'].split(',')[0].strip();
          request = urllib.request.Request('http://127.0.0.1:8000/ready', headers={'Host': host});
          urllib.request.urlopen(request, timeout=5).read()
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s
    logging: *default-logging

  celery_worker:
    build: *app-build
    restart: unless-stopped
    command: ["celery", "-A", "backend.app.core.celery.celery_app", "worker", "--loglevel=info", "-Q", "default,market,intelligence", "--concurrency", "${CELERY_WORKER_CONCURRENCY:-2}"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal, egress]
    volumes:
      - ml_artifacts_data:/app/data/ml_artifacts
      - trading_artifacts_data:/app/backend/trading/artifacts/ml_engine_v2
      - trading_outputs_data:/app/backend/trading/output
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.core.celery.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
    stop_grace_period: 60s
    logging: *default-logging

  celery_beat:
    build: *app-build
    restart: unless-stopped
    command: ["celery", "-A", "backend.app.core.celery.celery_app", "beat", "--loglevel=info", "--pidfile=/app/run/celerybeat.pid", "--schedule=/app/run/celerybeat-schedule"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - celery_beat_data:/app/run
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "test -r /app/run/celerybeat.pid && kill -0 $$(cat /app/run/celerybeat.pid)"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 20s
    stop_grace_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_API_PREFIX: /api/v1
        VITE_REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
        VITE_ANALYTICS_ENABLED: ${VITE_ANALYTICS_ENABLED:-false}
        VITE_POSTHOG_PROJECT_ID: ${VITE_POSTHOG_PROJECT_ID:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-https://app.posthog.com}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 10s
    logging: *default-logging

  backup:
    profiles: ["ops"]
    build:
      context: ./deploy/backup
    restart: "no"
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL is required}
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      BACKUP_ROOT: /backups
      BACKUP_DAILY_KEEP: ${BACKUP_DAILY_KEEP:-7}
      BACKUP_WEEKLY_KEEP: ${BACKUP_WEEKLY_KEEP:-4}
      BACKUP_MONTHLY_KEEP: ${BACKUP_MONTHLY_KEEP:-3}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CANONICAL_DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - backup_staging:/backups
      - ${BACKUP_PASSPHRASE_FILE_HOST:?BACKUP_PASSPHRASE_FILE_HOST is required}:/run/secrets/backup_passphrase:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, egress]
    logging: *default-logging

networks:
  edge:
  egress:
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
  backup_staging:
  ml_artifacts_data:
  trading_artifacts_data:
  trading_outputs_data:
